version: "3.7"

services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp" 
    #network_mode: host
    environment:
      TZ: 'Europe/Rome'
      WEBPASSWORD: #...personal data
    dns:
      - "1.1.1.1"
      - "8.8.8.8"
    volumes:
      - '/data/pihole/etc-pihole:/etc/pihole'
      - '/data/pihole/etc-dnsmasq.d:/etc/dnsmasq.d'
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
